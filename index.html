function gen(p){const[se,re,rest]=GOAL[p.goal],L=LV[p.level],eq=[...(p.equip||[]),'Körpergewicht'],used={};const max=Math.max(4,Math.round(p.dur/9));
 const days=SPLIT[p.days].map((s,i)=>{const[name,t]=s.split(':'),ex=[];T[t].forEach(m=>{let c=EX.filter(x=>x.m==m&&x.lv<=L&&eq.includes(x.eq));if(!c.length)c=EX.filter(x=>x.m==m&&x.lv<=L);if(!c.length)return;
  const k=m+t;used[k]=(used[k]||0);const x=c[(Math.floor(i/2)+used[k]++)%c.length];if(!ex.some(e=>e.id==x.id))ex.push({id:x.id,sets:p.goal=='Kraftsteigerung'&&x.lv>1?4:se,reps:x.re.includes('s')?x.re:re,kg:0,rest})});
  return{name,wd:WD[p.days][i],ex:ex.slice(0,max)}});

function bars(d,w=320,hh=120){if(!d.length)return'<p class="mu">Noch keine Daten.</p>';const mx=Math.max(...d.map(x=>x[1]),1),bw=w/d.length;return`<div class="sc"><svg viewBox="0 0 ${w} ${hh+18}" width="100%">`+d.map((x,i)=>{const bh=x[1]/mx*hh;return`<rect x="${i*bw+3}" y="${hh-bh}" width="${bw-6}" height="${bh}" rx="3" fill="#ff7a1a"/><text x="${i*bw+bw/2}" y="${hh+13}" text-anchor="middle">${esc(x[0])}</text>`}).join('')+'</svg></div>'}

R.db=()=>{const L=EX.filter(x=>(!mf||x.m==mf)&&(!favOnly||S.fav.includes(x.id))&&(x.de+x.en).toLowerCase().includes(q.toLowerCase()));
 return`<h1>Übungen <span class="mu" style="font-size:16px">${EX.length}</span></h1><div class="row"><input type="text" id="q" placeholder="Suchen (DE/EN)" value="${esc(q)}" style="flex:1"><select id="mf" style="width:auto"><option value="">Alle</option>${MU.map(m=>`<option ${m==mf?'selected':''}>${m}</option>`).join('')}</select><button class="${favOnly?'on':''}" data-a="favOnly">★</button></div><br>
 ${L.map(x=>`<div class="card"><div class="row sp"><div data-a="exOpen" data-k="${x.id}" style="flex:1;cursor:pointer"><b>${x.de}</b><br><span class="mu">${x.en} · ${x.m} · ${x.eq} · ${['','Einsteiger','Mittel','Fortgeschritten'][x.lv]}</span></div><button class="s ${S.fav.includes(x.id)?'on':''}" data-a="fav" data-k="${x.id}">★</button></div>
 ${open=='x'+x.id?`<p class="mu">Unterstützend: ${x.su||'–'}<br>Empfehlung: ${x.se}×${x.re}<br><b>Ausführung/Technik:</b> ${x.tip}<br><b>Häufiger Fehler:</b> ${x.fe}</p>`:''}</div>`).join('')||'<p class="mu">Keine Treffer.</p>'}`};
R.cal=()=>{const n=new Date(),b=new Date(n.getFullYear(),n.getMonth()+cm,1),p=plan(),first=(b.getDay()+6)%7,dim=new Date(b.getFullYear(),b.getMonth()+1,0).getDate(),today=iso(n);
 const pl=i=>{if(!p)return[];const dow=new Date(i+'T12:00').getDay(),r=p.days.filter(d=>d.wd==dow&&!S.moves[i]).map(d=>[d.name,0]);for(const k in S.moves)if(S.moves[k]==i){const o=p.days.find(d=>d.wd==new Date(k+'T12:00').getDay());if(o)r.push([o.name,1])}return r};
 let c=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="h">${x}</div>`).join('')+'<div class="h"></div>'.repeat(first);
 for(let d=1;d<=dim;d++){const i=iso(new Date(b.getFullYear(),b.getMonth(),d)),dn=S.sessions.filter(s=>iso(s.date)==i),pp=pl(i);let t='';
  dn.forEach(s=>t+=`<span class="tag dn">✓</span>`);if(!dn.length)pp.forEach(x=>t+=i<today&&!x[1]?`<span class="tag ms">ausgefallen</span>`:`<span class="tag ${x[1]?'mv':'pl'}">${x[1]?'verschoben':'geplant'}</span>`);if(!dn.length&&!pp.length)t='<span class="mu">Ruhe</span>';
  c+=`<div class="${i==today?'t':''}" data-a="selDay" data-k="${i}">${d}<br>${t}</div>`}
 const sp=sel?pl(sel):[],ds=sel?S.sessions.filter(s=>iso(s.date)==sel):[];
 return`<h1>Kalender</h1><div class="row sp"><button data-a="cm" data-k="-1">‹</button><b>${b.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button data-a="cm" data-k="1">›</button></div><br><div class="cal">${c}</div>
 ${sel?`<div class="card" style="margin-top:12px"><b>${fd(sel)}</b>${ds.map(s=>`<p>✓ ${esc(s.name)} · ${s.min} min · ${Math.round(vol(s))} kg Volumen</p>`).join('')}${sp.map(x=>`<p>${esc(x[0])} geplant${x[1]?' (verschoben)':''}</p>`).join('')}${!ds.length&&!sp.length?'<p class="mu">Ruhetag</p>':''}
 ${sp.length&&sel>=today?`<div class="row"><input type="date" id="mvd" value="${sel}"><button class="s" data-a="moveDay">Verschieben</button></div>`:''}</div>`:''}
 ${p&&adj(p).length?adj(p).map(w=>`<div class="warn">${w}</div>`).join(''):''}`};
R.prog=()=>{const ids=[...new Set(S.sessions.flatMap(s=>s.logs.map(l=>l.id)))],id=ids.includes(pex)?pex:ids[0],mv={};
 S.sessions.forEach(s=>s.logs.forEach(l=>mv[EX[l.id].m]=(mv[EX[l.id].m]||0)+l.sets.reduce((a,x)=>a+x.kg*x.reps,0)));
 const h=id!=null?hist(id):[];
 return`<h1>Fortschritte</h1>${!S.sessions.length?'<div class="card mu">Noch keine Trainings gespeichert.</div>':`<div class="card"><h3>Kraftentwicklung (geschätztes 1RM)</h3><select id="pex">${ids.map(i=>`<option value="${i}" ${i==id?'selected':''}>${EX[i].de}</option>`).join('')}</select>${line(h.map(x=>[iso(x.d).slice(5),Math.round(Math.max(...x.sets.map(s=>e1(s.kg,s.reps))))]))}</div>
 <div class="card"><h3>Volumen pro Muskelgruppe (kg)</h3>${bars(Object.entries(mv).map(([k,v])=>[k.slice(0,5),Math.round(v)]))}</div>
 <div class="card"><h3>Historie</h3>${h.slice().reverse().map(x=>`<p><b>${fd(x.d)}</b><br>${x.sets.map((s,i)=>`Satz ${i+1}: ${s.kg} kg × ${s.reps}${s.rir!==''&&s.rir!=null?' (RIR '+s.rir+')':''}`).join('<br>')}</p>`).join('')}</div>
 <div class="card"><h3>Trainingshäufigkeit</h3>${perBtn()}${bars(buckets().map(([l,s])=>[l,s.length]))}</div>`}`};

const A={nav:(d)=>{V=d.k},per:d=>{per=d.k},
 saveProf(){const g=i=>$(i).value,first=!S.profile;S.profile={age:+g('pa'),h:+g('ph'),w:+g('pw'),sex:g('ps'),level:g('pl'),goal:g('pg'),days:+g('pd'),dur:+g('pm')||60,equip:[...document.querySelectorAll('.pe:checked')].map(x=>x.value),inj:g('pi'),pref:g('pp')};
  if(!S.weights.length)S.weights.push({d:iso(new Date()),kg:S.profile.w});if(first||confirm('Neuen Plan passend zum Profil erzeugen? (Bestehende Pläne bleiben erhalten)')){const p=gen(S.profile);S.plans.push(p);S.planId=p.id}V='plan'},
 genPlan(){const p=gen(S.profile);S.plans.push(p);S.planId=p.id},
 dupPlan(){const p=JSON.parse(JSON.stringify(plan()));p.id=Date.now();p.name+=' (Kopie)';S.plans.push(p);S.planId=p.id},
 newPlan(){const p={id:Date.now(),name:'Eigener Plan',sys:'Individuell',days:[{name:'Tag 1',wd:1,ex:[]}]};S.plans.push(p);S.planId=p.id},
 delPlan(){if(confirm('Plan löschen?')){S.plans=S.plans.filter(p=>p.id!=S.planId);S.planId=S.plans[0]?.id}},
 delDay:d=>plan().days.splice(+d.d,1),addDay(){plan().days.push({name:'Tag '+(plan().days.length+1),wd:1,ex:[]})},
 mv(d){const a=plan().days[+d.d].ex,i=+d.e,j=i+ +d.k;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]},
 swap(d){open=open==d.d+'-'+d.e?null:d.d+'-'+d.e},delEx:d=>plan().days[+d.d].ex.splice(+d.e,1),
 addEx(d){const x=EX[+$('add'+d.d).value],[se,re,rest]=GOAL[S.profile.goal];plan().days[+d.d].ex.push({id:x.id,sets:se,reps:x.re.includes('s')?x.re:re,kg:0,rest})},
 start(d){const dy=plan().days[+d.d];S.active={start:Date.now(),name:dy.name,ex:dy.ex.map(e=>{const l=last(e.id);return{id:e.id,reps:e.reps,rest:e.rest,sets:e.sets,sets_:Array.from({length:e.sets},(_,i)=>({kg:e.kg||(l?(l[i]||l[l.length-1]).kg:0),reps:'',rir:'',done:false}))}})}},
 tick(d){const s=S.active.ex[+d.e].sets_[+d.s];if(!s.done&&s.reps===''){alert('Bitte Wiederholungen eintragen.');return}s.done=!s.done},
 addSet(d){const a=S.active.ex[+d.e].sets_;a.push({kg:a.length?a[a.length-1].kg:0,reps:'',rir:'',done:false})},
 takeKg(d){S.active.ex[+d.e].sets_.forEach(s=>{if(!s.done)s.kg=+d.k})},showEx(d){open=open=='t'+d.k?null:'t'+d.k},
 finish(){const a=S.active,logs=a.ex.map(e=>({id:e.id,sets:e.sets_.filter(s=>s.done).map(s=>({kg:+s.kg,reps:+s.reps,rir:s.rir}))})).filter(l=>l.sets.length);
  if(!logs.length&&!confirm('Keine Sätze abgehakt. Training verwerfen?'))return;
  if(logs.length){const prs=logs.filter(l=>Math.max(...l.sets.map(s=>e1(s.kg,s.reps)))>bestOf(l.id,a.start)&&bestOf(l.id,a.start)>0).map(l=>EX[l.id].de);
   S.sessions.push({id:a.start,date:a.start,name:a.name,min:Math.max(1,Math.round((Date.now()-a.start)/60000)),logs});if(prs.length)alert('🏆 Neue Bestleistung: '+prs.join(', '))}S.active=null;V='dash'},
 favOnly(){favOnly=!favOnly},fav(d){const k=+d.k;S.fav=S.fav.includes(k)?S.fav.filter(x=>x!=k):[...S.fav,k]},exOpen(d){open=open=='x'+d.k?null:'x'+d.k},
 cm(d){cm+=+d.k},selDay(d){sel=d.k},moveDay(){const t=$('mvd').value;if(t&&t!=sel){S.moves[sel]=t;sel=t}},
 addW(){const v=+$('nw').value;if(v)S.weights.push({d:iso(new Date()),kg:v})},
 export(){dl('fitcoach-backup.json',JSON.stringify(S,null,1),'application/json')},
 exportCsv(){dl('trainings.csv','Datum;Uhrzeit;Training;Übung;Satz;kg;Wdh;RIR\n'+S.sessions.flatMap(s=>s.logs.flatMap(l=>l.sets.map((x,i)=>[iso(s.date),new Date(s.date).toLocaleTimeString('de-DE'),s.name,EX[l.id].de,i+1,x.kg,x.reps,x.rir].join(';')))).join('\n'),'text/csv')},
 notif(){if(!('Notification' in window))return alert('Nicht unterstützt.');Notification.requestPermission().then(r=>alert(r=='granted'?'Erinnerungen erscheinen, solange die App geöffnet ist und heute ein Trainingstag ist.':'Nicht erlaubt.'))},
 reset(){if(confirm('Wirklich ALLE Daten löschen?')){S={profile:null,plans:[],planId:null,sessions:[],active:null,weights:[],fav:[],moves:{}}}}};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;try{a.click()}catch(e){}}
const C={selPlan:el=>{S.planId=el.value},dname:(el,d)=>{plan().days[+d.d].name=el.value},dwd:(el,d)=>{plan().days[+d.d].wd=+el.value},
 ef:(el,d)=>{plan().days[+d.d].ex[+d.e][d.f]=d.f=='reps'?el.value:+el.value},swapTo:(el,d)=>{if(!isNaN(el.value)&&el.value!=='Alternative wählen…'){plan().days[+d.d].ex[+d.e].id=+el.value;open=null}},
